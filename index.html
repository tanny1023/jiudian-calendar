<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>九典行事曆與雙週大事紀</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1c2330; --sub:#5d6778; --line:#dde1e8;
  --accent:#1f5fbf; --accent-ink:#fff; --ok:#12703a; --warn:#b45309; --out-bg:#eef4ff; --we:#f0f2f6; --today:#fff8e1;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#12161d; --card:#1b212b; --ink:#e7ebf2; --sub:#9aa5b8; --line:#2c3543;
    --accent:#5b9bff; --accent-ink:#0b1220; --ok:#5fd28f; --warn:#f0a94a; --out-bg:#18263d; --we:#171c25; --today:#2b2610;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 "Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
.lead{color:var(--sub);margin:0 0 18px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.seg button{border:0;background:transparent;color:var(--ink);padding:8px 18px;font:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 3px}
input[type=text],input[type=number],input[type=date],input[type=month],textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);
  color:var(--ink);font:inherit}
textarea{resize:vertical;min-height:38px;line-height:1.45}
button.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
button.ghost:hover{border-color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools .sp{flex:1}
.tools input[type=month]{width:auto}
.tools label.chk{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:14px;color:var(--ink)}
.hint{color:var(--sub);font-size:13px}
.status{font-size:13px;color:var(--ok);min-height:20px}
.status.err{color:#c0392b}

/* 行事曆 */
.day{display:grid;grid-template-columns:92px minmax(0,1.3fr) minmax(0,1fr);gap:10px;
  padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:6px;align-items:start}
.day.we{background:var(--we)}
.day.today{background:var(--today);border-color:var(--warn)}
.day .dh{padding-top:6px;line-height:1.3}
.day .dh b{font-size:17px;display:block}
.day .dh span{font-size:13px;color:var(--sub)}
.day .dh i{font-style:normal;font-size:12px;color:var(--warn);display:block}
.day label{margin:0 0 2px;font-size:12px}
.day textarea{overflow:hidden}
@media(max-width:700px){.day{grid-template-columns:1fr}.day .dh{display:flex;gap:8px;align-items:baseline;padding:0}}
.empty{padding:40px 10px;text-align:center;color:var(--sub)}

/* 雙週大事紀 */
.grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#out{min-height:240px;white-space:pre-wrap;font-size:16px;line-height:1.7;background:var(--out-bg);border-color:var(--accent)}
.notes{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);font-size:14px}
.notes h3{margin:0 0 6px;font-size:14px}
.notes ul{margin:4px 0 8px;padding-left:20px}
.notes li{margin:2px 0}
.notes .warn{color:var(--warn)}
.notes .okc{color:var(--ok)}
details summary{cursor:pointer;color:var(--sub);font-size:13px;margin-top:6px}
.remind{margin-top:10px;font-size:14px;color:var(--sub);border-left:3px solid var(--accent);padding-left:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>九典行事曆與雙週大事紀</h1>
  <p class="lead">取代 Excel「01-行事曆」分頁：在這裡填寫每日會議與報表事項，選好期間就能產生「雙週大事紀」純文字。資料只存在這台電腦的瀏覽器裡（不會上傳）。</p>

  <div class="seg">
    <button id="t1" aria-pressed="true">行事曆</button>
    <button id="t2" aria-pressed="false">雙週大事紀</button>
  </div>

  <!-- ========== 行事曆 ========== -->
  <section id="p1">
    <div class="tools">
      <button class="ghost" id="prevM">‹ 上個月</button>
      <input type="month" id="month">
      <button class="ghost" id="nextM">下個月 ›</button>
      <button class="ghost" id="goToday">今天</button>
      <label class="chk"><input type="checkbox" id="onlyFilled"> 只顯示有內容的日子</label>
      <span class="sp"></span>
      <button class="ghost" id="btnImport">匯入 Excel</button>
      <button class="ghost" id="btnExport">匯出 Excel</button>
      <button class="ghost" id="btnTsv">複製本月（貼回 Excel）</button>
      <input type="file" id="file" accept=".xlsx,.xlsm,.xls" hidden>
    </div>
    <div class="status" id="saveStatus"></div>
    <div id="cal"></div>
    <p class="hint">會議欄「一行＝一個 Excel 儲存格」，同一格有多場會議時用「、」隔開（例：上午9:00第145次週會、第359次專業技術協調會議）。報表／備註欄不會進大事紀。</p>
  </section>

  <!-- ========== 雙週大事紀 ========== -->
  <section id="p2" hidden>
    <div class="grid">
      <div class="card">
        <div class="row2">
          <div><label for="dStart">第一天</label><input type="date" id="dStart"></div>
          <div><label for="dEnd">最後一天</label><input type="date" id="dEnd"></div>
        </div>
        <div class="btnrow">
          <button class="ghost" id="prevB">‹ 前一雙週</button>
          <button class="ghost" id="nextB">後一雙週 ›</button>
          <button class="ghost" id="thisB">本週起算</button>
        </div>
        <label for="gap">時間近接合併（相差幾分鐘內併為同一個時間標示）</label>
        <input type="number" id="gap" min="0" max="240" step="5">
        <label for="noise">排除關鍵字（一行一個；含此字的會議不列入）</label>
        <textarea id="noise" rows="6"></textarea>
        <p class="hint">只讀「會議」欄；「報表」欄的繳交提醒本來就不會列入。</p>
      </div>
      <div>
        <div class="card">
          <label for="out" style="margin-top:0">大事紀（可直接修改文字後再複製）</label>
          <textarea id="out" rows="12" spellcheck="false"></textarea>
          <div class="btnrow">
            <button class="primary" id="copyOut">複製大事紀</button>
            <button class="ghost" id="copyAll">連同提醒一起複製</button>
          </div>
          <div class="status" id="outStatus"></div>
        </div>
        <div class="notes" id="notes"></div>
        <div class="remind" id="remind"></div>
      </div>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
const WD = ['日','一','二','三','四','五','六'];
const pad = n => String(n).padStart(2,'0');
const key = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;
const parseKey = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const keyOf = dt => key(dt.getFullYear(),dt.getMonth()+1,dt.getDate());
const addDays = (k,n) => { const d=parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const wdOf = k => parseKey(k).getDay();
const md = k => `${pad(+k.slice(5,7))}/${pad(+k.slice(8,10))}`;
const todayKey = () => keyOf(new Date());
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

/* ---------- 資料 ---------- */
// days = { 'YYYY-MM-DD': {a:'周次', r:'報表', m:'會議（一行一格）'} }，只存有內容的日子
let days = {};
try{ days = JSON.parse(store.get('jd_days','{}')) || {}; }catch(e){ days = {}; }

let saveT;
function saveSoon(){
  clearTimeout(saveT);
  saveT = setTimeout(()=>{
    store.set('jd_days', JSON.stringify(days));
    const s=$('saveStatus'); s.textContent='已自動儲存'; setTimeout(()=>{ if(s.textContent==='已自動儲存') s.textContent=''; },1500);
    if(!$('p2').hidden) gen();
  },300);
}
function setDay(k,f,v){
  const d = days[k] || (days[k]={a:'',r:'',m:''});
  d[f]=v;
  if(!d.a && !d.r && !d.m.trim()) delete days[k];
  saveSoon();
}

/* ---------- 行事曆畫面 ---------- */
function fit(ta){ ta.style.height='auto'; ta.style.height=(ta.scrollHeight+2)+'px'; }

function renderCal(){
  const [y,mo] = $('month').value.split('-').map(Number);
  const n = new Date(y,mo,0).getDate();
  const only = $('onlyFilled').checked, today = todayKey();
  const box = $('cal'); box.innerHTML='';
  let shown = 0;
  for(let d=1; d<=n; d++){
    const k = key(y,mo,d), rec = days[k], w = wdOf(k);
    if(only && !(rec && (rec.m||rec.r))) continue;
    shown++;
    const row = document.createElement('div');
    row.className = 'day' + ((w===0||w===6)?' we':'') + (k===today?' today':'');
    const dh = document.createElement('div'); dh.className='dh';
    dh.innerHTML = `<b>${pad(mo)}/${pad(d)}</b><span>週${WD[w]}</span>` + (k===today?'<i>今天</i>':'');
    const mk = (label,field,ph)=>{
      const wrap=document.createElement('div');
      const lb=document.createElement('label'); lb.textContent=label;
      const ta=document.createElement('textarea'); ta.rows=1; ta.placeholder=ph; ta.value=(rec&&rec[field])||'';
      ta.addEventListener('input',()=>{ setDay(k,field,ta.value); fit(ta); });
      wrap.append(lb,ta); return {wrap,ta};
    };
    const m = mk('會議（一行一格）','m','例：上午9:00第145次週會、第359次專業技術協調會議');
    const r = mk('報表／備註','r','');
    row.append(dh,m.wrap,r.wrap);
    box.appendChild(row);
    fit(m.ta); fit(r.ta);
  }
  if(!shown) box.innerHTML = `<div class="empty">${only?'這個月還沒有任何內容。':'沒有日期。'}<br>${Object.keys(days).length?'':'還沒有資料，可按上方「匯入 Excel」帶入現有的行事曆分頁。'}</div>`;
}

function setMonth(v){ $('month').value=v; store.set('jd_month',v); renderCal(); }
function shiftMonth(delta){
  const [y,m]=$('month').value.split('-').map(Number);
  const d=new Date(y,m-1+delta,1); setMonth(`${d.getFullYear()}-${pad(d.getMonth()+1)}`);
}

/* ---------- Excel 匯入／匯出 ---------- */
function serialToKey(v){
  if(v instanceof Date) return keyOf(v);
  if(typeof v==='number'){ const d=new Date(Math.round((v-25569)*86400000)); return key(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate()); }
  const m=String(v).trim().match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  return m ? key(+m[1],+m[2],+m[3]) : null;
}
function keyToSerial(k){ const [y,m,d]=k.split('-').map(Number); return (Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000; }

function importWorkbook(wb){
  const name = wb.SheetNames.find(n=>/行事曆/.test(n)) || wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:''});
  const out = {}; let cnt=0;
  rows.slice(1).forEach(r=>{
    const k = serialToKey(r[1]);
    if(!k) return;
    const txt = v => (typeof v==='number' ? String(Math.round(v*100)/100) : String(v==null?'':v)).replace(/\r/g,'').trim();
    const rec = {
      a: txt(r[0]),
      r: txt(r[3]),
      m: r.slice(4).map(txt).filter(Boolean).join('\n')
    };
    if(rec.a || rec.r || rec.m){ out[k]=rec; cnt++; }
  });
  return {days:out, count:cnt, sheet:name};
}

async function doImport(file){
  if(!file) return;
  if(typeof XLSX==='undefined'){ alert('Excel 元件沒有載入成功（可能沒有網路），請連上網路後重新整理。'); return; }
  try{
    const wb = XLSX.read(await file.arrayBuffer(),{type:'array'});
    const res = importWorkbook(wb);
    if(!res.count){ alert('在「'+res.sheet+'」分頁沒有讀到日期資料，請確認欄位順序：周次、日期、星期、報表、會議…'); return; }
    if(Object.keys(days).length && !confirm(`將以「${res.sheet}」的 ${res.count} 天資料取代目前行事曆內容，確定嗎？\n（建議先按「匯出 Excel」備份）`)) return;
    days = res.days; store.set('jd_days',JSON.stringify(days));
    renderCal(); if(!$('p2').hidden) gen();
    $('saveStatus').textContent = `已匯入「${res.sheet}」${res.count} 天資料`;
  }catch(e){ alert('讀取失敗：'+(e.message||e)); }
}

function buildRows(keys){
  const maxM = Math.max(1, ...keys.map(k=>days[k]?days[k].m.split('\n').filter(s=>s.trim()).length:0));
  const head = ['周次','日期','星期','報表'].concat(Array.from({length:maxM},()=>'會議'));
  const rows = keys.map(k=>{
    const rec = days[k]||{a:'',r:'',m:''};
    return {k, cells:[rec.a,null,'星期'+WD[wdOf(k)],rec.r].concat(rec.m.split('\n').filter(s=>s.trim()))};
  });
  return {head,rows};
}
function allKeysContinuous(){
  const ks=Object.keys(days).sort(); if(!ks.length) return [];
  const out=[]; for(let k=ks[0]; k<=ks[ks.length-1]; k=addDays(k,1)) out.push(k);
  return out;
}

function doExport(){
  if(typeof XLSX==='undefined'){ alert('Excel 元件沒有載入成功（可能沒有網路）。'); return; }
  const keys = allKeysContinuous();
  if(!keys.length){ alert('目前沒有資料可匯出。'); return; }
  const {head,rows} = buildRows(keys);
  const ws = XLSX.utils.aoa_to_sheet([head].concat(rows.map(r=>r.cells.map(c=>c==null?'':c))));
  rows.forEach((r,i)=>{ ws[XLSX.utils.encode_cell({r:i+1,c:1})] = {t:'n', v:keyToSerial(r.k), z:'yyyy/m/d'}; });
  ws['!cols'] = [{wch:6},{wch:12},{wch:8},{wch:50}].concat(head.slice(4).map(()=>({wch:42})));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'01-行事曆');
  const t=new Date();
  XLSX.writeFile(wb,`九典行事曆_${t.getFullYear()}${pad(t.getMonth()+1)}${pad(t.getDate())}.xlsx`);
}

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    try{ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
      const ok=document.execCommand('copy'); ta.remove(); return ok; }catch(e2){ return false; }
  }
}

async function copyTsv(){
  const [y,mo]=$('month').value.split('-').map(Number), n=new Date(y,mo,0).getDate();
  const keys=Array.from({length:n},(_,i)=>key(y,mo,i+1));
  const {rows} = buildRows(keys);
  const q = s => /[\t\n"]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  const tsv = rows.map(r=>r.cells.map((c,i)=> i===1 ? `${+r.k.slice(0,4)}/${+r.k.slice(5,7)}/${+r.k.slice(8,10)}` : q(c==null?'':String(c))).join('\t')).join('\n');
  const ok = await copyText(tsv);
  $('saveStatus').textContent = ok ? `已複製 ${$('month').value} 整月（${n} 列），到 Excel 日期欄第一列貼上即可` : '複製失敗';
}

/* ---------- 雙週大事紀：解析規則 ---------- */
const SERIES = [
  {id:'week', name:'工程進度週會',      re:/週會|工程進度、品質暨職業安全衛生管制協調會議/, every:7},
  {id:'tech', name:'專業技術協調會議',  re:/專業技術協調會議/, every:7},
  {id:'bim',  name:'BIM界面協調整合會議', re:/BIM\s*界面/i, every:14},
  {id:'sup',  name:'專管督導',          re:/專管督導/, every:14},
  {id:'org',  name:'機關督導',          re:/機關督導/, every:14},
  {id:'prog', name:'進度會議',          re:/進度會議/, every:14}
];
const DEFAULT_NOISE = ['提交','下載','給運動局','資料提供','繳交','請假','私事','烤肉','到職'];

function seriesOf(t){
  if(/巨蛋會議/.test(t)) return null;
  const s = SERIES.find(s=>s.re.test(t));
  return s ? s.id : null;
}
function rankOf(it){
  const s=it.text;
  if(/局長|建設局|市長|運動局/.test(s)) return 1;
  if(it.series==='prog' || /新工|處長|巨蛋會議|總工|副總/.test(s)) return 2;
  if(it.series==='org' || /建工科/.test(s)) return 3;
  if(it.series==='sup') return 4;
  if(it.series==='tech') return 5;
  if(it.series==='week') return 6;
  if(it.series==='bim') return 7;
  return 8;
}

function mkTime(period,h,mi){
  h=+h; mi=+(mi||0);
  if(period==='下午'||period==='晚上'){ if(h<12) h+=12; }
  else if(period==='中午'){ if(h<11) h+=12; }
  else if(!period){ if(h>=1&&h<=6) h+=12; }
  if(h>23||mi>59) return null;
  return {min:h*60+mi, label:`${h<12?'上午':'下午'}${pad(h)}:${pad(mi)}`};
}
const PER='(上午|下午|早上|中午|晚上)';
const RNG='(?:\\s*[-~～–—至]\\s*\\d{1,2}\\s*[:：]\\s*\\d{2})?';
function extractTime(p){
  let m;
  if((m=p.match(new RegExp('^'+PER+'?\\s*(\\d{1,2})\\s*[:：]\\s*(\\d{2})'+RNG+'\\s*')))){
    const t=mkTime(m[1],m[2],m[3]); if(t) return {time:t,rest:p.slice(m[0].length)};
  }
  if((m=p.match(new RegExp('^'+PER+'?\\s*(\\d{1,2})\\s*點\\s*(半|\\d{1,2})?\\s*分?\\s*')))){
    const t=mkTime(m[1],m[2],m[3]==='半'?30:m[3]); if(t) return {time:t,rest:p.slice(m[0].length)};
  }
  if((m=p.match(new RegExp('^'+PER+'\\s*(\\d{2})(\\d{2})(?!\\d)\\s*')))){
    const t=mkTime(m[1],m[2],m[3]); if(t) return {time:t,rest:p.slice(m[0].length)};
  }
  if((m=p.match(new RegExp('^'+PER+'\\s*')))){
    const am = m[1]==='上午'||m[1]==='早上';
    return {time:{min:am?480:780,label:am?'上午':'下午'},rest:p.slice(m[0].length)};
  }
  if((m=p.match(new RegExp('\\s*(\\d{1,2})\\s*[:：]\\s*(\\d{2})'+RNG+'\\s*$')))){
    const t=mkTime('',m[1],m[2]); if(t) return {time:t,rest:p.slice(0,m.index)};
  }
  return {time:null,rest:p};
}

function normalizeItem(t){
  t = t.replace(/[\(（]\s*雙[周週]\s*[\)）]/g,'')
       .replace(/[\(（][^)）]*已收會議紀錄[^)）]*[\)）]/g,'')
       .replace(/第\s*(\d+)\s*次/g,'第$1次')
       .replace(/^[：:\-、，,\s]+/,'').trim();
  if(!t) return null;
  const series = seriesOf(t);
  const nm = t.match(/第(\d+)次/), num = nm ? +nm[1] : null;
  let m;
  if((m=t.match(/^(?:召開)?巨蛋會議\s*[\(（]([^)）]*)[\)）]\s*[:：]?\s*(.*)$/))){
    const who=m[1].replace(/主持$/,'').trim();
    t = `${who}主持巨蛋會議` + (m[2]?`：${m[2]}`:'');
  }else if(/機關督導/.test(t)){
    t = num!=null ? `建工科第${num}次機關督導` : '建工科機關督導';
  }else if(series==='prog' && (m=t.match(/進度會議\s*[\(（]([^)）]*)[\)）]/))){
    const who=m[1].replace(/主持$/,'').trim();
    if(who) t = `${who}主持進度會議`;
  }
  t = t.replace(/週會/,'工程進度、品質暨職業安全衛生管制協調會議');
  return {text:t, series, num};
}

function parseCell(line,k){
  const P='\u0001';
  const parts = line.replace(/工程進度、品質/g,'工程進度'+P+'品質').split('、')
    .map(x=>x.split(P).join('、').trim()).filter(Boolean);
  const out=[]; let inh=null;
  for(const p of parts){
    const t=extractTime(p);
    if(t.time) inh=t.time;
    const tm = t.time || inh;
    const it = normalizeItem(t.rest);
    if(!it) continue;
    out.push(Object.assign(it,{k, min:tm?tm.min:null, label:tm?tm.label:''}));
  }
  return out;
}

function noiseRe(){
  const ws=$('noise').value.split('\n').map(s=>s.trim()).filter(Boolean);
  return ws.length ? new RegExp(ws.map(esc).join('|')) : null;
}

function collect(){
  const re=noiseRe(), items=[], excluded=[];
  Object.keys(days).sort().forEach(k=>{
    (days[k].m||'').split('\n').forEach(line=>{
      line=line.trim(); if(!line) return;
      if(re && re.test(line)){ excluded.push({k,raw:line}); return; }
      parseCell(line,k).forEach(it=>items.push(it));
    });
  });
  return {items,excluded};
}

// 屆次檢核：與前一次「來源」屆次完全相同 → 自動 +1；其餘不連續的只提出疑問
function checkNumbers(items){
  const notes={fixed:[],warn:[]}, prev={};
  items.forEach(it=>{
    if(!it.series || it.num==null) return;
    const name=SERIES.find(s=>s.id===it.series).name, p=prev[it.series];
    it.raw=it.num;
    if(p){
      if(it.raw===p.raw){ it.num=p.out+1; it.fixed=true; }
      else if(it.raw<=p.out || it.raw>p.out+1) it.warn=`${name}第${it.raw}次（前一次 ${md(p.k)} 為第${p.out}次，屆次不連續）`;
    }
    if(it.fixed) it.text=it.text.replace(`第${it.raw}次`,`第${it.num}次`);
    prev[it.series]={raw:it.raw,out:it.num,k:it.k};
  });
}

function checkMissing(items,start,end){
  const warns=[], inR=items.filter(i=>i.k>=start&&i.k<=end);
  const last=id=>{ const c=items.filter(i=>i.series===id&&i.k<start); return c.length?md(c[c.length-1].k):'無紀錄'; };
  SERIES.forEach(s=>{
    if(s.every===7){
      for(let mon=addDays(start,-((wdOf(start)+6)%7)); mon<=end; mon=addDays(mon,7)){
        const sun=addDays(mon,6), a=mon<start?start:mon, b=sun>end?end:sun;
        let wd=0; for(let k=a;k<=b;k=addDays(k,1)){ const w=wdOf(k); if(w>=1&&w<=5) wd++; }
        if(wd<3) continue;
        if(!inR.some(i=>i.series===s.id&&i.k>=mon&&i.k<=sun))
          warns.push(`${md(a)}～${md(b)} 該週行事曆沒有「${s.name}」，是否漏列？（上次出現：${last(s.id)}）`);
      }
    }else if((parseKey(end)-parseKey(start))/86400000>=10 && !inR.some(i=>i.series===s.id)){
      warns.push(`這個期間沒有「${s.name}」，是否漏列？（上次出現：${last(s.id)}）`);
    }
  });
  return warns;
}

function buildDayLine(k,items,gap){
  const seen=new Set();
  items=items.filter(i=>!seen.has(i.text)&&seen.add(i.text));
  const byRank=(a,b)=>a.rank-b.rank||(a.min??0)-(b.min??0);
  const untimed=items.filter(i=>i.min==null).sort(byRank);
  const timed=items.filter(i=>i.min!=null).sort((a,b)=>a.min-b.min||a.rank-b.rank);
  const clusters=[];
  timed.forEach(it=>{
    const c=clusters[clusters.length-1];
    if(c && it.min-c[0].min<=gap) c.push(it); else clusters.push([it]);
  });
  const parts=[];
  if(untimed.length) parts.push(untimed.map(i=>i.text).join('、'));
  clusters.forEach(c=>{
    const s=c.slice().sort(byRank), head=s[0];     // 以最高層級單位的時間為標示點
    parts.push(`${head.label} ${s.map(i=>i.text).join('、')}`);
  });
  const dt=parseKey(k);
  return `${dt.getFullYear()-1911}${pad(dt.getMonth()+1)}${pad(dt.getDate())}(${WD[dt.getDay()]})` + parts.join('、');
}

let lastBody='', lastRemind='';
function gen(){
  const start=$('dStart').value, end=$('dEnd').value;
  const notes=$('notes'), out=$('out');
  if(!start||!end||start>end){ out.value=''; notes.innerHTML='<span class="warn">請先選好第一天與最後一天。</span>'; $('remind').textContent=''; return; }
  const gap=Math.max(0,+$('gap').value||0);
  const {items,excluded}=collect();
  items.forEach(i=>i.rank=rankOf(i));
  checkNumbers(items);
  const inR=items.filter(i=>i.k>=start&&i.k<=end);
  const byDay={}; inR.forEach(i=>(byDay[i.k]||(byDay[i.k]=[])).push(i));
  const lines=Object.keys(byDay).sort().map(k=>buildDayLine(k,byDay[k],gap));
  lastBody = [`雙週大事紀(${md(start)}-${md(end)}):`].concat(lines).join('\n');
  out.value = lastBody;
  fitOut();

  const fixed=inR.filter(i=>i.fixed), warnN=inR.filter(i=>i.warn).map(i=>`${md(i.k)} ${i.warn}`);
  const miss=checkMissing(items,start,end);
  const exR=excluded.filter(e=>e.k>=start&&e.k<=end);
  let h='';
  h+='<h3>屆次檢核</h3>';
  h+= fixed.length
    ? '<ul>'+fixed.map(i=>`<li class="warn">${md(i.k)} ${SERIES.find(s=>s.id===i.series).name}：來源寫第${i.raw}次，與前一次重複，已自動推進為第${i.num}次</li>`).join('')+'</ul>'
    : '<p class="okc" style="margin:2px 0 8px">會議屆次皆已正確遞增，沒有重複。</p>';
  if(warnN.length) h+='<ul>'+warnN.map(w=>`<li class="warn">${w}</li>`).join('')+'</ul>';
  h+='<h3>例行會議漏列檢查</h3>';
  h+= miss.length ? '<ul>'+miss.map(w=>`<li class="warn">${w}</li>`).join('')+'</ul>' : '<p class="okc" style="margin:2px 0 8px">例行會議（週會、專技、BIM、專管／機關督導、進度會議）都有列在行事曆。</p>';
  h+=`<h3>已排除 ${exR.length} 項</h3>`;
  h+= exR.length ? '<details><summary>檢視被排除的項目</summary><ul>'+exR.map(e=>`<li>${md(e.k)}　${e.raw.replace(/</g,'&lt;')}</li>`).join('')+'</ul></details>' : '<p class="hint" style="margin:2px 0">（無）</p>';
  notes.innerHTML=h;

  const probs=warnN.concat(miss);
  lastRemind = '提醒您：經檢核本次行事曆內容，'
    + (fixed.length ? `已將重複的會議屆次自動推進（${fixed.map(i=>`${SERIES.find(s=>s.id===i.series).name}第${i.raw}→${i.num}次`).join('、')}）` : '已自動正確遞增會議屆次')
    + '；且已排除所有行政庶務與作業提醒事項並完成排版'
    + (probs.length ? `，另有 ${probs.length} 項疑問（見上方）請您確認。` : '，您可直接複製使用！')
    + '請確認內容是否需要手動微調。';
  $('remind').textContent=lastRemind;
}
function fitOut(){ const o=$('out'); o.style.height='auto'; o.style.height=Math.max(240,o.scrollHeight+4)+'px'; }

/* ---------- 事件 ---------- */
function setPane(n){
  $('p1').hidden = n!==1; $('p2').hidden = n!==2;
  $('t1').setAttribute('aria-pressed',n===1); $('t2').setAttribute('aria-pressed',n===2);
  store.set('jd_pane',String(n));
  if(n===2) gen();
}
$('t1').onclick=()=>setPane(1); $('t2').onclick=()=>setPane(2);
$('month').addEventListener('change',()=>{ if($('month').value) setMonth($('month').value); });
$('prevM').onclick=()=>shiftMonth(-1); $('nextM').onclick=()=>shiftMonth(1);
$('goToday').onclick=()=>{ const t=new Date(); setMonth(`${t.getFullYear()}-${pad(t.getMonth()+1)}`); };
$('onlyFilled').addEventListener('change',renderCal);
$('btnImport').onclick=()=>$('file').click();
$('file').addEventListener('change',e=>{ doImport(e.target.files[0]); e.target.value=''; });
$('btnExport').onclick=doExport;
$('btnTsv').onclick=copyTsv;

function setRange(s){ $('dStart').value=s; $('dEnd').value=addDays(s,11); store.set('jd_start',s); gen(); }
function mondayOf(k){ return addDays(k,-((wdOf(k)+6)%7)); }
$('dStart').addEventListener('change',()=>{ if($('dStart').value){ $('dEnd').value=addDays($('dStart').value,11); gen(); } });
$('dEnd').addEventListener('change',gen);
$('prevB').onclick=()=>setRange(addDays($('dStart').value||mondayOf(todayKey()),-14));
$('nextB').onclick=()=>setRange(addDays($('dStart').value||mondayOf(todayKey()),14));
$('thisB').onclick=()=>setRange(mondayOf(todayKey()));
$('gap').addEventListener('input',()=>{ store.set('jd_gap',$('gap').value); gen(); });
$('noise').addEventListener('input',()=>{ store.set('jd_noise',$('noise').value); gen(); });
$('out').addEventListener('input',fitOut);
const flashOut=(msg,ok=true)=>{ const s=$('outStatus'); s.textContent=msg; s.className='status'+(ok?'':' err'); setTimeout(()=>s.textContent='',2000); };
$('copyOut').onclick=async()=>flashOut(await copyText($('out').value)?'已複製大事紀':'複製失敗，請手動選取',true);
$('copyAll').onclick=async()=>flashOut(await copyText($('out').value+'\n'+'-'.repeat(40)+'\n'+lastRemind)?'已連同提醒複製':'複製失敗，請手動選取',true);

/* ---------- 初始化 ---------- */
(function init(){
  const t=new Date();
  $('month').value = store.get('jd_month',`${t.getFullYear()}-${pad(t.getMonth()+1)}`);
  $('gap').value = store.get('jd_gap','60');
  $('noise').value = store.get('jd_noise',DEFAULT_NOISE.join('\n'));
  const s = store.get('jd_start',''); setRange(s||mondayOf(todayKey()));
  renderCal();
  setPane(store.get('jd_pane','1')==='2'?2:1);
})();
</script>
